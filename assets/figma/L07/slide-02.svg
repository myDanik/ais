<text fill="#161B18" style="white-space: pre" xml:space="preserve" font-family="Prata" font-size="84" letter-spacing="0px"><tspan x="328.729" y="163.002">Один документ, три проверки</tspan></text>
<rect x="144" y="213" width="1632" height="4" fill="#1D9A78"/>
<text fill="#65706A" style="white-space: pre" xml:space="preserve" font-family="Carlito" font-size="22" letter-spacing="0px"><tspan x="144" y="1025.52">Системы искусственного интеллекта · NLP</tspan></text>
<text fill="#65706A" style="white-space: pre" xml:space="preserve" font-family="Carlito" font-size="22" letter-spacing="0px"><tspan x="1764.85" y="1025.52">2</tspan></text>
<text fill="#65706A" style="white-space: pre" xml:space="preserve" font-family="Carlito" font-size="46" letter-spacing="0px"><tspan x="460.783" y="325.223">Учебный документ D03 · правила продления книги</tspan></text>
<text fill="#65706A" style="white-space: pre" xml:space="preserve" font-family="Carlito" font-size="42" letter-spacing="0px"><tspan x="364.585" y="421.355">Вопрос</tspan></text>
<text fill="#65706A" style="white-space: pre" xml:space="preserve" font-family="Carlito" font-size="42" letter-spacing="0px"><tspan x="861.914" y="421.355">Основание в D03</tspan></text>
<text fill="#65706A" style="white-space: pre" xml:space="preserve" font-family="Carlito" font-size="42" letter-spacing="0px"><tspan x="1381.14" y="421.355">Ожидаемый ответ</tspan></text>
<text fill="#161B18" style="white-space: pre" xml:space="preserve" font-family="Carlito" font-size="48" letter-spacing="0px"><tspan x="275.25" y="491.406">На какой срок?</tspan></text>
<text fill="#161B18" style="white-space: pre" xml:space="preserve" font-family="Carlito" font-size="48" letter-spacing="0px"><tspan x="891.703" y="491.406">Срок указан</tspan></text>
<text fill="#161B18" style="white-space: pre" xml:space="preserve" font-family="Carlito" font-size="48" letter-spacing="0px"><tspan x="1464.05" y="491.406">14 дней</tspan></text>
<text fill="#161B18" style="white-space: pre" xml:space="preserve" font-family="Carlito" font-size="48" letter-spacing="0px"><tspan x="238.594" y="563.406">При чужой брони?</tspan></text>
<text fill="#161B18" style="white-space: pre" xml:space="preserve" font-family="Carlito" font-size="48" letter-spacing="0px"><tspan x="779.695" y="563.406">Продление запрещено</tspan></text>
<text fill="#161B18" style="white-space: pre" xml:space="preserve" font-family="Carlito" font-size="48" letter-spacing="0px"><tspan x="1508.88" y="563.406">Нет</tspan></text>
<text fill="#161B18" style="white-space: pre" xml:space="preserve" font-family="Carlito" font-size="48" letter-spacing="0px"><tspan x="180.609" y="635.406">Сколько раз за семестр?</tspan></text>
<text fill="#161B18" style="white-space: pre" xml:space="preserve" font-family="Carlito" font-size="48" letter-spacing="0px"><tspan x="844.875" y="635.406">Число не задано</tspan></text>
<text fill="#161B18" style="white-space: pre" xml:space="preserve" font-family="Carlito" font-size="48" letter-spacing="0px"><tspan x="1411.31" y="635.406">НЕТ ДАННЫХ</tspan></text>
<text fill="#65706A" style="white-space: pre" xml:space="preserve" font-family="Carlito" font-size="42" letter-spacing="0px"><tspan x="400.731" y="931.355">Сначала определяем ответы сами — затем проверяем модель</tspan></text>
<text fill="#0070C0" style="white-space: pre" xml:space="preserve" font-family="Carlito" font-size="26" letter-spacing="0px"><tspan x="1470.2" y="976.387">Учебная база «Север» · D03</tspan></text>
